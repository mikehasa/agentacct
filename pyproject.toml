[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentacct"
version = "0.5.1"
description = "Local-first Agent Work Intelligence for coding agents: usage truth, recorded work, and honest joins"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "mikehasa" },
]
keywords = [
  "agent",
  "ai-agents",
  "finops",
  "llm",
  "cost-tracking",
  "claude-code",
  "codex",
  "mcp",
  "developer-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "psutil>=5",
  "pydantic>=2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/mikehasa/agentacct"
Repository = "https://github.com/mikehasa/agentacct"
Issues = "https://github.com/mikehasa/agentacct/issues"

[project.scripts]
agentacct = "agentacct.cli:app"
agentacct-claude = "agentacct.wrappers:sentinel_claude_main"
agentacct-codex = "agentacct.wrappers:sentinel_codex_main"

# Artifacts ship src/ packages only. tests/ is excluded from BOTH the wheel
# (src-layout find below) and the sdist (MANIFEST.in prunes): the shipped
# suite would lack conftest.py — the autouse store pin + real-store tripwire —
# so stray `pytest` runs from an unpacked sdist could write into a real
# ledger. The repo is the test suite's home.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentacct.canonical" = ["schema.sql"]

[tool.pytest.ini_options]
# Include the repo root ("." after src) so cross-test helper imports like
# `from tests.test_client_usage import ...` resolve under a plain `pytest -q`
# invocation (CI), not only under `python -m pytest` (which adds the CWD). Both
# invocations then behave identically.
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
