# Defensive alias distribution for the hyphenated spelling of the name.
#
# PEP 503 normalization collapses runs of -_. but never removes them, so
# `agent-acct` and `agentacct` are two DISTINCT PyPI projects. This one exists
# so the hyphenated guess resolves to the real tool instead of to whatever a
# squatter might upload later.
#
# It is deliberately a real alias, not an empty placeholder: it ships no code
# and no console scripts, and simply depends on `agentacct`, so
# `pip install agent-acct` installs the actual package and its `agentacct`
# command. A content-free name grab would be squatting (and disputable under
# PEP 541); a working alias is not.
#
# Because it only depends on `agentacct` with no upper bound, it never needs
# republishing when agentacct releases a new version.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-acct"
version = "0.1.0"
description = "Alias for agentacct — installs the real agentacct distribution"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "mikehasa" },
]
keywords = [
  "agentacct",
  "agent",
  "ai-agents",
  "cost-tracking",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "agentacct>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/mikehasa/agentacct"
Repository = "https://github.com/mikehasa/agentacct"
Issues = "https://github.com/mikehasa/agentacct/issues"

# Metadata-only: no modules, no scripts. `agentacct` supplies both. Declaring
# an empty package list keeps setuptools' auto-discovery from scanning (and
# failing on) the surrounding repository tree.
[tool.setuptools]
packages = []
