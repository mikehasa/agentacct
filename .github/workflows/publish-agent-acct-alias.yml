# PyPI trusted publishing for the `agent-acct` ALIAS distribution (OIDC — no
# long-lived tokens). The alias source lives in packaging/agent-acct/ and only
# depends on `agentacct`; see that directory's pyproject for why it exists.
#
# Separate from publish.yml on purpose: a trusted publisher is matched by
# owner + repository + workflow FILENAME + environment, so a second PyPI
# project needs its own workflow file and its own environments. Keeping them
# apart also means this workflow's credentials can never touch `agentacct`.
#
# Manual only. There is no tag or release trigger: the alias is published once
# to claim the name and then effectively never again (it carries no upper bound
# on `agentacct`, so new agentacct releases need no republish).
#
# One-time owner setup before the first run (agents must never do these — they
# involve account credentials):
#
#   1. On https://test.pypi.org — account sidebar -> Publishing -> "Add a
#      pending publisher": project `agent-acct`, owner `mikehasa`, repository
#      `agentacct`, workflow `publish-agent-acct-alias.yml`, environment
#      `testpypi-alias`.
#   2. Same on https://pypi.org with environment `pypi-alias`.
#      NOTE: a pending publisher does NOT reserve the name — nothing reserves a
#      PyPI name until the first successful upload.
#   3. GitHub repo Settings -> Environments: create `testpypi-alias` and
#      `pypi-alias`, and add required reviewers on `pypi-alias`. GitHub
#      auto-creates a referenced environment WITHOUT protection rules, so
#      skipping this silently removes the human checkpoint.
#
# Then: run this workflow with "publish to real PyPI" unchecked to rehearse on
# TestPyPI, and again with it checked to claim the real name.

name: publish-agent-acct-alias

on:
  workflow_dispatch:
    inputs:
      publish_real_pypi:
        description: "Also publish to real PyPI (needs pypi-alias approval)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-agent-acct-alias
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - name: Build the alias distribution
        working-directory: packaging/agent-acct
        run: python -m build --outdir "$GITHUB_WORKSPACE/dist"
      - name: Refuse to ship anything that is not the alias
        # This workflow holds the `agent-acct` publisher identity. If a build
        # change ever produced the main agentacct artifacts here, they would be
        # uploaded under the wrong project name. Fail closed instead.
        run: |
          python - <<'EOF'
          import pathlib
          import sys
          import zipfile

          files = sorted(p.name for p in pathlib.Path("dist").iterdir())
          if not files:
              sys.exit("no artifacts were built")
          unexpected = [name for name in files if not name.startswith("agent_acct-")]
          if unexpected:
              sys.exit(f"refusing to publish non-alias artifacts: {unexpected}")

          wheels = [name for name in files if name.endswith(".whl")]
          if len(wheels) != 1:
              sys.exit(f"expected exactly one alias wheel, got {wheels}")
          with zipfile.ZipFile(pathlib.Path("dist") / wheels[0]) as archive:
              metadata = next(
                  archive.read(item).decode("utf-8")
                  for item in archive.namelist()
                  if item.endswith(".dist-info/METADATA")
              )
          if "Name: agent-acct" not in metadata:
              sys.exit("built wheel does not declare Name: agent-acct")
          if "Requires-Dist: agentacct" not in metadata:
              sys.exit("alias must depend on agentacct — an empty name grab is not the intent")
          print(f"alias artifacts verified: {files}")
          EOF
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-agent-acct
          path: dist/

  publish-testpypi:
    needs: build
    if: github.repository_owner == 'mikehasa'
    runs-on: ubuntu-latest
    environment: testpypi-alias
    permissions:
      id-token: write # OIDC — the only credential
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-agent-acct
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    # Real PyPI only when the run explicitly asked for it, never from forks.
    # The `pypi-alias` environment's required-reviewer approval (owner setup
    # step 3) is the human gate on top.
    needs: publish-testpypi
    if: github.repository_owner == 'mikehasa' && inputs.publish_real_pypi
    runs-on: ubuntu-latest
    environment: pypi-alias
    permissions:
      id-token: write # OIDC — the only credential
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-agent-acct
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
